const screen=new URLSearchParams(location.search).get('screen')||'dashboard';

function pill(text,kind='good'){return `<span class="pill ${kind}"><i class="dot"></i>${text}</span>`}
function shell(active,body,context='BikeAssist'){const nav=[['dashboard','Vue d’ensemble','home'],['garage','Mes vélos','bike'],['rides','Sorties','route'],['maintenance','Entretiens','wrench']];const mobileLabels=['Accueil','Vélos','Sorties','Entretien'];return `<aside class="sidebar"><div class="brand"><div class="brand-mark">${I.logo}</div><div class="brand-name">Bike<span>Assist</span></div></div><div class="nav-caption">ESPACE PERSONNEL</div><nav class="nav-list">${nav.map(([id,label,ic])=>`<div class="nav-item ${active===id?'active':''}">${I[ic]}<span>${label}</span></div>`).join('')}</nav><div class="nav-divider"></div><div class="nav-item">${I.help}<span>Centre d’aide</span></div><div class="sidebar-spacer"></div><div class="local-note">${I.shield}<div><strong>Vos données restent privées</strong><span>Enregistrées sur cet appareil</span></div></div><div class="profile"><div class="avatar">JL</div><div><div class="profile-name">Julien LACARELLE</div><div class="profile-sub">Compte personnel</div></div></div></aside><div class="maincol"><header class="topbar"><div class="top-context">${context}</div><div class="top-actions"><div class="save-status"><i class="save-dot"></i>Enregistré sur cet appareil</div><div class="help-link">${I.help} Aide</div></div></header><main class="main"><div class="page">${body}</div></main></div><nav class="mobile-nav">${nav.map(([id,label,ic],index)=>`<div class="mobile-nav-item ${active===id?'active':''}">${I[ic]}<span>${mobileLabels[index]}</span></div>`).join('')}</nav>`}

function metric(label,value,foot,icon){return `<div class="card metric"><div class="metric-copy"><div class="metric-label">${label}</div><div class="metric-num">${value}</div><div class="metric-foot">${foot}</div></div><div class="metric-icon">${I[icon]}</div></div>`}
function dash(){return shell('dashboard',`${`<div class="page-head" style="margin-bottom:17px"><div><div class="eyebrow">JEUDI 16 OCTOBRE 2026</div><h1>Bonjour Julien <span style="font-size:22px">👋</span></h1><p>Un œil sur vos vélos, l’esprit libre pour rouler.</p></div>${btn('Ajouter une sortie','plus','primary')}</div>`}<section class="dashboard-hero"><div class="hero-copy"><div class="hero-kicker"><i class="status-dot"></i>VOTRE GARAGE SE PORTE BIEN</div><div class="hero-number">2 480 <span style="font-size:17px;font-weight:500">km</span></div><div class="hero-description">parcourus cette année avec vos vélos</div><div class="hero-foot"><span class="pill good">Tout est à jour</span><span class="small-text">+ 320 km ce mois-ci</span></div></div><img class="hero-image" src="${bikeImg}" alt="Illustration vélo gravel"></section><div class="stats-row">${metric('Vélos dans le garage','02','1 vélo à surveiller','bike')}${metric('Sorties ce mois-ci','12','Dernière sortie · hier','route')}${metric('Entretiens à prévoir','01','Chaîne · dans 40 km','wrench')}</div><div class="grid cols-2"><section class="card card-pad dash-follow"><div class="card-head"><div><h2 class="section-title">À surveiller</h2><p class="section-sub">L’usure de vos pièces, en un coup d’œil.</p></div><span class="pill warn">1 bientôt</span></div><div class="component-line"><div><div class="component-name">Chaîne</div><div class="component-model">Gravel du quotidien · Shimano</div></div><div><div class="progress warning"><span style="width:92%"></span></div></div><div><div class="component-val">460 km</div><div class="component-remaining">sur 500 km</div></div></div><div class="component-line"><div><div class="component-name">Cassette</div><div class="component-model">Gravel du quotidien · 12 vitesses</div></div><div><div class="progress"><span style="width:49%"></span></div></div><div><div class="component-val">1 220 km</div><div class="component-remaining">sur 2 500 km</div></div></div><div class="component-line"><div><div class="component-name">Plateaux</div><div class="component-model">Gravel du quotidien · 40 dents</div></div><div><div class="progress"><span style="width:56%"></span></div></div><div><div class="component-val">2 800 km</div><div class="component-remaining">sur 5 000 km</div></div></div><div style="margin-top:12px"><span class="link">Voir mes vélos ${I.arrow}</span></div></section><section class="card card-pad"><div class="card-head"><div><h2 class="section-title">Sorties récentes</h2><p class="section-sub">Votre activité des derniers jours.</p></div><span class="link">Tout voir ${I.arrow}</span></div><div class="recent-list"><div class="recent-item"><div class="ride-icon">${I.route}</div><div><div class="ride-title">Boucle des bords de Marne</div><div class="ride-meta">Hier · Gravel du quotidien</div></div><div class="ride-distance">42,6 km<small>1 h 52</small></div></div><div class="recent-item"><div class="ride-icon">${I.route}</div><div><div class="ride-title">Forêt de Ferrières</div><div class="ride-meta">12 oct. · Vélo de route</div></div><div class="ride-distance">36,2 km<small>1 h 34</small></div></div><div class="recent-item"><div class="ride-icon">${I.route}</div><div><div class="ride-title">Sortie du dimanche</div><div class="ride-meta">8 oct. · Gravel du quotidien</div></div><div class="ride-distance">58,1 km<small>2 h 28</small></div></div></div></section></div>`,'Votre espace · Vue d’ensemble')}
function garage(){return shell('garage',`${pageHead('Mon garage','2 vélos · gérez leur kilométrage et l’état de leurs pièces.',btn('Ajouter un vélo','plus','primary'))}<div class="garage-summary"><div class="garage-summary-left"><span class="pill neutral">2 vélos</span><span>Vos vélos, toujours à portée de main.</span></div><span class="small-text muted">Tri : <strong style="color:#424242">Récemment utilisés ${I.down}</strong></span></div><div class="filter-row"><span class="filter-chip selected">Tous les vélos · 2</span><span class="filter-chip">À surveiller · 1</span></div><div class="bike-grid"><article class="card bike-card"><div class="bike-card-top"><div class="bike-thumb"><img src="${bikeImg}" alt=""></div><div><div class="bike-title">Gravel du quotidien</div><div class="bike-model">Canyon Grizl 7 · Gravel</div></div><div class="bike-km"><strong>3 248 km</strong><span>kilométrage total</span></div></div><div class="bike-card-info">${pill('Tout est à jour','good')}<span class="micro">Dernière sortie · hier</span></div><div class="bike-parts"><div class="part-mini"><span>Chaîne</span><strong>460 / 500 km</strong></div><div class="part-mini"><span>Cassette</span><strong>1 220 / 2 500 km</strong></div><div class="part-mini"><span>Plateaux</span><strong>2 800 / 5 000 km</strong></div></div><div class="bike-card-bottom"><span class="micro">Ajouté le 12 avril 2025</span><span class="link">Voir le vélo ${I.chevron}</span></div></article><article class="card bike-card"><div class="bike-card-top"><div class="bike-thumb"><img src="${bikeImg}" alt=""></div><div><div class="bike-title">Vélo de route</div><div class="bike-model">Trek Domane AL 4 · Route</div></div><div class="bike-km"><strong>1 860 km</strong><span>kilométrage total</span></div></div><div class="bike-card-info">${pill('Bon état','good')}<span class="micro">Dernière sortie · 12 oct.</span></div><div class="bike-parts"><div class="part-mini"><span>Chaîne</span><strong>220 / 500 km</strong></div><div class="part-mini"><span>Cassette</span><strong>760 / 2 500 km</strong></div><div class="part-mini"><span>Plateaux</span><strong>1 100 / 5 000 km</strong></div></div><div class="bike-card-bottom"><span class="micro">Ajouté le 3 juin 2025</span><span class="link">Voir le vélo ${I.chevron}</span></div></article><div class="add-bike-card"><div class="plus-circle">${I.plus}</div><strong>Ajouter un vélo</strong><span>Complétez votre garage</span></div></div>`,'Votre espace · Mon garage')}
